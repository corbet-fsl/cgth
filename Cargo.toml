[package]
name = "cgth"
version = "0.1.0"
edition = "2024"
description = "Gather for the volatile forum"
repository = "https://git.corbet.ch/corbet-libs/cgth.git"
license-file = "LICENSE.md"

[features]
default = []
issuer = ["cmbl/issuer"]

[dependencies]
cswb = { git = "https://git.corbet.ch/corbet-foss/cswb.git", branch = "v01" }
clkp = { git = "https://git.corbet.ch/corbet-foss/clkp.git", branch = "v01" }
cmmr = { git = "https://git.corbet.ch/corbet-foss/cmmr.git", branch = "v01" }
cthl = { git = "https://git.corbet.ch/corbet-foss/cthl.git", branch = "v01" }
cmbl = { git = "https://git.corbet.ch/corbet-foss/cmbl.git", branch = "v01" }

cshm = { git = "https://git.corbet.ch/corbet-foss/cshm.git", branch = "v01" }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
